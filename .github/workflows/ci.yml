name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yesod_foundation_test
          POSTGRES_USER: yesod_ci
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yesod_ci -d yesod_foundation_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FOUNDATION_TEST_DATABASE_URL: postgresql+asyncpg://yesod_ci:ci-disposable-password@localhost:5432/yesod_foundation_test
      FOUNDATION_TEST_VALKEY_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Update TLS trust before installing Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          python -m pip install --no-cache-dir --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - name: Install Python dependencies
        run: python -m pip install -r api/requirements.txt -r admin/requirements.txt ruff==0.14.2
      - name: Verify lint, assets, API, admin and real services
        run: bash scripts/verify-foundation.sh
      - name: Build deployment images
        run: |
          docker build -t yesod-api:ci api
          docker build -t yesod-admin:ci admin
