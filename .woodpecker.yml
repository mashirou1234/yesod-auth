# テスト・lintはWoodpeckerで実行する（GitHub Actionsでは実行しない）。
when:
  - event: [pull_request]
  - event: [push]
    branch: [main, master]

steps:
  - name: python-checks
    image: python:3.12-slim
    when:
      - event: [pull_request, push]
        path:
          exclude: ["docs/**", "README.md", "AGENTS.md"]
          on_empty: true
    commands:
      - bash scripts/cloud-setup.sh
      - .venv/bin/ruff check api/
      - .venv/bin/ruff format --check api/
      - bash scripts/cloud-test.sh

  - name: notify-failure-ntfy
    image: codeberg.org/l-x/woodpecker-ntfy
    when:
      - event: [push]
        branch: [main, master]
        status: [failure]
    settings:
      url:
        from_secret: ntfy_url
      token:
        from_secret: ntfy_token
      title: "[CI FAILED] ${CI_REPO} #${CI_PIPELINE_NUMBER}"
      click: ${CI_PIPELINE_URL}
      priority: high
      tags: warning,rotating_light
      message: |
        Repository: ${CI_REPO}
        Branch: ${CI_COMMIT_BRANCH}
        Pipeline: #${CI_PIPELINE_NUMBER}
        URL: ${CI_PIPELINE_URL}
