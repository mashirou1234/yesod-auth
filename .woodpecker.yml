# Keep the required Woodpecker pipeline meaningful for this Python repository.
when:
  - event: [pull_request, push, manual]

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yesod_foundation_test
      POSTGRES_USER: yesod_ci
      POSTGRES_PASSWORD: ci-disposable-password
  - name: valkey
    image: valkey/valkey:8-alpine

steps:
  - name: build-admin-assets
    image: oven/bun:1.4.4
    commands:
      - cd admin
      - bun install --frozen-lockfile
      - bun run build:tour

  - name: verify-python
    image: python:3.12-slim
    environment:
      FOUNDATION_TEST_DATABASE_URL: postgresql+asyncpg://yesod_ci:ci-disposable-password@postgres:5432/yesod_foundation_test
      FOUNDATION_TEST_VALKEY_URL: redis://valkey:6379/0
    commands:
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
      - python -m pip install --no-cache-dir --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - python -m pip install -r api/requirements.txt -r admin/requirements.txt ruff==0.14.2
      - bash scripts/verify-foundation.sh lint
      - bash scripts/verify-foundation.sh assets
      - bash scripts/verify-foundation.sh unit
      - python -m compileall -q api/app admin
      - cd api && RUNTIME_MODE=test python -c 'from app.main import app; assert app.openapi()["paths"]' && cd ..
      - bash scripts/verify-foundation.sh integration

  - name: notify-failure-ntfy
    image: codeberg.org/l-x/woodpecker-ntfy
    when:
      - event: [push]
        branch: [main, master]
        status: [failure]
    settings:
      url:
        from_secret: ntfy_url
      token:
        from_secret: ntfy_token
      title: "[CI FAILED] ${CI_REPO} #${CI_PIPELINE_NUMBER}"
      click: ${CI_PIPELINE_URL}
      priority: high
      tags: warning,rotating_light
      message: |
        Repository: ${CI_REPO}
        Branch: ${CI_COMMIT_BRANCH}
        Pipeline: #${CI_PIPELINE_NUMBER}
        URL: ${CI_PIPELINE_URL}
