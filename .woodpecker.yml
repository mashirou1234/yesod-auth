# CIとPR自動化はWoodpeckerで実行する。
when:
  - event: [pull_request]
  - event: [push]
    branch: [main, master]
  - event: [cron]
    cron: pr-maintenance
    branch: [main, master]

steps:
  - name: python-checks
    image: python:3.12-slim
    when:
      - event: [pull_request, push]
        path:
          exclude: ["docs/**", "README.md", "AGENTS.md"]
          on_empty: true
    commands:
      - bash scripts/cloud-setup.sh
      - .venv/bin/ruff check api/
      - .venv/bin/ruff format --check api/
      - .venv/bin/ruff check --config api/pyproject.toml scripts/woodpecker_pr_automation.py scripts/tests/
      - .venv/bin/ruff format --config api/pyproject.toml --check scripts/woodpecker_pr_automation.py scripts/tests/
      - python -m unittest discover -s scripts/tests -v
      - bash scripts/cloud-test.sh

  # Repository secret must allow ONLY cron events in Woodpecker settings.
  # The scheduled ref must be the protected main/master branch, never a PR ref.
  - name: pr-maintenance
    image: python:3.12-slim
    when:
      - event: [cron]
        cron: pr-maintenance
        branch: [main, master]
    environment:
      PR_AUTOMATION_TOKEN:
        from_secret: pr_automation_token
    commands:
      - python scripts/woodpecker_pr_automation.py --apply

  - name: notify-failure-ntfy
    image: codeberg.org/l-x/woodpecker-ntfy
    when:
      - event: [push]
        branch: [main, master]
        status: [failure]
    settings:
      url:
        from_secret: ntfy_url
      token:
        from_secret: ntfy_token
      title: "[CI FAILED] ${CI_REPO} #${CI_PIPELINE_NUMBER}"
      click: ${CI_PIPELINE_URL}
      priority: high
      tags: warning,rotating_light
      message: |
        Repository: ${CI_REPO}
        Branch: ${CI_COMMIT_BRANCH}
        Pipeline: #${CI_PIPELINE_NUMBER}
        URL: ${CI_PIPELINE_URL}
