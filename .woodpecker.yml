# push(main/master) と pull_request を有効化。
# docs/ + README.md + AGENTS.md だけの変更は重い検証ステップを成功スキップする。
# 非Rustリポジトリで誤配布された場合は、Cargo.toml 未検出時に各ステップを成功スキップする。
when:
  - event: [pull_request]
  - event: [push]
    branch: [main, master]

steps:
  - name: detect-docs-only
    image: rust:1
    commands:
      - |
        set -eu
        docs_only_file=".ci_docs_only"
        event="${CI_PIPELINE_EVENT:-}"
        if [ "${event}" != "pull_request" ] && [ "${event}" != "push" ]; then
          echo "0" > "${docs_only_file}"
          exit 0
        fi

        head="${CI_COMMIT_SHA:-HEAD}"
        before="${CI_COMMIT_BEFORE:-}"
        if [ -n "${before}" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
          range="${before} ${head}"
        elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
          range="HEAD~1 HEAD"
        else
          echo "0" > "${docs_only_file}"
          echo "Skip docs-only optimization: cannot resolve diff base."
          exit 0
        fi

        changed_files="$(git diff --name-only ${range} || true)"
        if [ -z "${changed_files}" ]; then
          echo "0" > "${docs_only_file}"
          echo "No changed files detected. Run full CI."
          exit 0
        fi

        non_docs_files="$(printf '%s\n' "${changed_files}" | grep -Ev '^(docs/|README\.md$|AGENTS\.md$)' || true)"
        if [ -n "${non_docs_files}" ]; then
          echo "0" > "${docs_only_file}"
          echo "Detected non-doc files. Run full CI."
        else
          echo "1" > "${docs_only_file}"
          echo "Docs-only change detected. Skip heavy CI steps."
        fi

  - name: fmt
    image: rust:1
    depends_on:
      - detect-docs-only
    commands:
      - |
        set -eu
        if [ -f .ci_docs_only ] && [ "$(cat .ci_docs_only)" = "1" ]; then
          echo "Docs-only change. Skip fmt."
          exit 0
        fi
        if [ ! -f Cargo.toml ]; then
          echo "Cargo.toml not found. Skip fmt."
          exit 0
        fi
        if [ -f rust-toolchain.toml ]; then
          toolchain="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n 1)"
        elif [ -f rust-toolchain ]; then
          toolchain="$(head -n 1 rust-toolchain | tr -d '[:space:]')"
        else
          toolchain=""
        fi
        if [ -n "${toolchain}" ]; then
          rustup toolchain install "${toolchain}" --profile minimal
          rustup default "${toolchain}"
        else
          echo "rust-toolchain* not found. Use rust:1 (stable)."
        fi
      - rustup component add rustfmt
      - cargo fmt --check

  - name: clippy
    image: rust:1
    depends_on:
      - detect-docs-only
    commands:
      - |
        set -eu
        if [ -f .ci_docs_only ] && [ "$(cat .ci_docs_only)" = "1" ]; then
          echo "Docs-only change. Skip clippy."
          exit 0
        fi
        if [ ! -f Cargo.toml ]; then
          echo "Cargo.toml not found. Skip clippy."
          exit 0
        fi
        if [ -f rust-toolchain.toml ]; then
          toolchain="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n 1)"
        elif [ -f rust-toolchain ]; then
          toolchain="$(head -n 1 rust-toolchain | tr -d '[:space:]')"
        else
          toolchain=""
        fi
        if [ -n "${toolchain}" ]; then
          rustup toolchain install "${toolchain}" --profile minimal
          rustup default "${toolchain}"
        else
          echo "rust-toolchain* not found. Use rust:1 (stable)."
        fi
      - rustup component add clippy
      - cargo clippy -- -D warnings

  - name: test
    image: rust:1
    depends_on:
      - detect-docs-only
    commands:
      - |
        set -eu
        if [ -f .ci_docs_only ] && [ "$(cat .ci_docs_only)" = "1" ]; then
          echo "Docs-only change. Skip test."
          exit 0
        fi
        if [ ! -f Cargo.toml ]; then
          echo "Cargo.toml not found. Skip test."
          exit 0
        fi
        if [ -f rust-toolchain.toml ]; then
          toolchain="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n 1)"
        elif [ -f rust-toolchain ]; then
          toolchain="$(head -n 1 rust-toolchain | tr -d '[:space:]')"
        else
          toolchain=""
        fi
        if [ -n "${toolchain}" ]; then
          rustup toolchain install "${toolchain}" --profile minimal
          rustup default "${toolchain}"
        else
          echo "rust-toolchain* not found. Use rust:1 (stable)."
        fi
      - cargo test

  - name: build-release
    image: rust:1
    depends_on:
      - detect-docs-only
    commands:
      - |
        set -eu
        if [ -f .ci_docs_only ] && [ "$(cat .ci_docs_only)" = "1" ]; then
          echo "Docs-only change. Skip build-release."
          exit 0
        fi
        if [ ! -f Cargo.toml ]; then
          echo "Cargo.toml not found. Skip build-release."
          exit 0
        fi
        if [ -f rust-toolchain.toml ]; then
          toolchain="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -n 1)"
        elif [ -f rust-toolchain ]; then
          toolchain="$(head -n 1 rust-toolchain | tr -d '[:space:]')"
        else
          toolchain=""
        fi
        if [ -n "${toolchain}" ]; then
          rustup toolchain install "${toolchain}" --profile minimal
          rustup default "${toolchain}"
        else
          echo "rust-toolchain* not found. Use rust:1 (stable)."
        fi
      - cargo build --release

  - name: notify-failure-ntfy
    image: codeberg.org/l-x/woodpecker-ntfy
    when:
      - event: [push]
        branch: [main, master]
        status: [failure]
    settings:
      url:
        from_secret: ntfy_url
      token:
        from_secret: ntfy_token
      title: "[CI FAILED] ${CI_REPO} #${CI_PIPELINE_NUMBER}"
      click: ${CI_PIPELINE_URL}
      priority: high
      tags: warning,rotating_light
      message: |
        Repository: ${CI_REPO}
        Branch: ${CI_COMMIT_BRANCH}
        Pipeline: #${CI_PIPELINE_NUMBER}
        URL: ${CI_PIPELINE_URL}
